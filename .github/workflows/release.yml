# Push a tag like v0.1.1 -> builds the extension and attaches feedfilter-v0.1.1.zip to a GitHub release.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npm run package
      # also as feedfilter.zip, so releases/latest/download/feedfilter.zip always points at the newest version
      - run: cp "dist/feedfilter-${GITHUB_REF_NAME}.zip" dist/feedfilter.zip
      - run: gh release create "$GITHUB_REF_NAME" dist/feedfilter.zip "dist/feedfilter-${GITHUB_REF_NAME}.zip" --title "Feed Filter $GITHUB_REF_NAME" --notes-file .github/release-notes.md
        env: { GH_TOKEN: "${{ github.token }}" }
